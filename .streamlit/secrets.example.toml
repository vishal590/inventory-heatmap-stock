# Copy to .streamlit/secrets.toml and fill in your Snowflake creds
# Used when running in Snowsight Streamlit; local run uses CSV fallback unless you connect manually.
[connections.snowflake]
account = "<account_name>"       # e.g., xy12345.ap-southeast-1
user = "<user>"
password = "<password>"
warehouse = "<warehouse>"
database = "AI_GOOD"
schema = "PUBLIC"
role = "SYSADMIN"
